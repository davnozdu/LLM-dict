[package]
name = "llm-dict"
version = "0.15.1"
edition = "2021"
rust-version = "1.82"
description = "Диктовка через LLM: горячая клавиша, распознавание речи в облаке, вставка под курсором"
license = "MIT"
repository = "https://github.com/davnozdu/LLM-dict"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.36"
tray-icon = "0.24"
cpal = "0.18"
hound = "3.5"
arboard = "3.6"
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "blocking", "rustls", "webpki-roots", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
open = "5"
rfd = "0.17"
log = "0.4"

# Локальное распознавание. onnxruntime для parakeet линкуется статически —
# отдельных библиотек в бандл класть не нужно.
#
# whisper.cpp отсюда убран намеренно: он нёс собственную копию ggml, и вместе
# с llama.cpp в одном бинарнике получалось 349 дублирующихся символов двух
# разных версий. Линкер выбирал одну, и вторая библиотека работала с чужим
# ggml — это держалось на везении. Parakeet работает на ONNX и ggml не тянет,
# поэтому копия остаётся ровно одна.
parakeet-rs = "0.3"

# Локальная языковая модель. Собирается статически, как и whisper.cpp.
llama-cpp-2 = { version = "0.1.155", default-features = false, features = ["metal"] }
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
